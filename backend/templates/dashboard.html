<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap"
      rel="stylesheet"
    />

    <meta charset="UTF-8" />
    <title>YouTube Tracker</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="stats">
      <div class="stat-box">
        <h2 id="total-videos">0</h2>
        <p>videos watched</p>
      </div>
      <div class="stat-box">
        <h2 id="today-videos">0s</h2>
        <p>today's watch time</p>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>title</th>
          <th>seconds watched</th>
          <th>watched at</th>
        </tr>
      </thead>
      <tbody id="video-list"></tbody>
    </table>

    <h2>Daily Watch Time</h2>
    <div id="daily-summary"></div>

    <script>
      async function loadDaily() {
        const res = await fetch("https://youtube-tracker.railway.internal/daily");
        const days = await res.json();

        const container = document.getElementById("daily-summary");
        container.innerHTML = days
          .map(
            (d) => `
                    <div class="stat-box" style="display: flex; justify-content: space-between;">
                        <span>${d.date}</span>
                        <span>${formatTime(d.total_seconds)}</span>
                    </div>
                `,
          )
          .join("");

        const todayTime = document.getElementById("today-videos");
        todayTime.textContent = formatTime(days[0]?.total_seconds);
      }
      async function loadVideos() {
        const res = await fetch("https://youtube-tracker-production-2dbe.up.railway.app//videos");
        const videos = await res.json();

        document.getElementById("total-videos").textContent = videos.length;

        const tbody = document.getElementById("video-list");
        tbody.innerHTML = videos
          .map(
            (v) => `
                    <tr>
                        <td><a href="https://youtube.com/watch?v=${v.video_id}" target="_blank">${v.title}</a></td>
                        <td>${formatTime(v.seconds_watched)}</td>
                        <td>${new Date(v.watched_at).toLocaleString()}</td>
                    </tr>
                `,
          )
          .join("");
      }

      function formatTime(seconds) {
        if (!seconds) return "0s";
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        if (m === 0) return `${s}s`;
        return `${m}m ${s}s`;
      }

      loadDaily();
      loadVideos();
      setInterval(loadDaily, 36000); // 1 minute
      setInterval(loadVideos, 36000);

    </script>
  </body>
</html>
